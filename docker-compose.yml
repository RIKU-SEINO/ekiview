services:
  backend:
    hostname: backend
    container_name: backend
    build: ./backend
    environment:
      PG_HOST: ${PG_HOST}
      PG_PORT: ${PG_PORT}
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      PG_DB: ${PG_DB}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - 5001:5001
    depends_on:
      - db
      - redis
    networks:
      - app-network

  db:
    hostname: db
    container_name: db
    image: postgres:${PG_VERSION}
    restart: always
    volumes:
      - db-store:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${PG_DB}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      TZ: ${TZ}
    ports:
      - ${PG_PORT}:${PG_PORT}
    networks:
      - app-network

  redis:
    hostname: redis
    container_name: redis
    image: redis:alpine
    restart: always
    environment:
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
    ports:
      - ${REDIS_PORT}:${REDIS_PORT}
    volumes:
      - redis-store:/data
    networks:
      - app-network

  frontend:
    container_name: frontend
    hostname: frontend
    build: ./frontend
    ports:
      - 3001:3001
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - app-network

volumes:
  db-store:
  redis-store:

networks:
  app-network:
    driver: bridge
